<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<title>shot cheat sheet 🎬</title>
<style>
  :root{--plane:#0a0a0c;--surface:#16161b;--surface-2:#1f1f26;--ink:#fff;--ink-2:#c3c2b7;--muted:#9a988f;--ring:rgba(255,255,255,.10);--ring-2:rgba(255,255,255,.22);
         --accent:#86b6ef;--accent-2:#d95926;--rec:#ff4d4d;--pad:clamp(16px,3vw,40px);--nav-h:120px;color-scheme:dark}
  html{scroll-padding-top:calc(var(--nav-h) + 12px)}
  @media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(80rem 40rem at 15% -10%,#1b2a4a 0%,transparent 60%),
               radial-gradient(60rem 35rem at 90% 0%,#3a1e14 0%,transparent 55%),var(--plane);
    color:var(--ink);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;padding:var(--pad);padding-top:max(var(--pad),env(safe-area-inset-top));min-height:100vh
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:clamp(30px,5.5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.02}
  h1 .grad{background:linear-gradient(92deg,#86b6ef,#d95926 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--ink-2);margin-top:8px;max-width:62ch}

  /* sticky jump nav: scrolls sideways on phones, wraps on desktop */
  .toc{position:sticky;top:0;z-index:20;margin:18px calc(-1 * var(--pad)) 0;padding:8px var(--pad);
       background:rgba(10,10,12,.82);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
       border-bottom:1px solid var(--ring)}
  .toc ul{position:relative;list-style:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
          max-width:1180px;margin:0 auto;padding-right:28px;mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .toc ul::-webkit-scrollbar{display:none}
  .toc a{display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:36px;padding:0 12px;border-radius:999px;
         font-size:13.5px;font-weight:600;color:var(--ink-2);text-decoration:none;background:var(--surface);border:1px solid var(--ring)}
  .toc a small{font-weight:500;color:var(--muted);font-size:12px}
  .toc a:hover{border-color:var(--ring-2);color:var(--ink)}
  .toc a[aria-current="true"]{background:var(--ink);color:var(--plane);border-color:var(--ink)}
  .toc a[aria-current="true"] small{color:#55534d}
  @media (min-width:900px){.toc ul{flex-wrap:wrap;padding-right:0;mask-image:none}}
  /* top-level tabs: 5 groups, each filters the page to its own sections */
  .groups{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;max-width:1180px;margin:0 auto 8px;padding:3px;
          background:var(--surface);border:1px solid var(--ring);border-radius:12px}
  .groups button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px;padding:4px 2px;border:0;border-radius:9px;
                 background:none;color:var(--ink-2);font:600 11.5px/1.15 inherit;cursor:pointer;min-width:0}
  .groups button span{font-size:17px}
  .groups button:hover{color:var(--ink);background:var(--surface-2)}
  .groups button[aria-selected="true"]{background:var(--ink);color:var(--plane)}
  .groups button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  @media (min-width:700px){.groups button{flex-direction:row;justify-content:center;gap:7px;font-size:14px}}
  section[hidden]{display:none}
  /* subject ideas: text cards, no animation */
  .ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
  .idea{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:12px 14px}
  .idea h3{font-size:15.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
  .idea p{font-size:13.5px;color:var(--ink-2)}
  a:focus-visible,.vf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  section{margin-top:40px}
  h2{display:flex;align-items:center;gap:10px;font-size:clamp(19px,2.4vw,22px);font-weight:750;letter-spacing:-.01em;margin-bottom:14px}
  h2 i{font-style:normal;font-size:1.15em}
  h2 small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
  h2::after{content:"";flex:1;height:1px;background:var(--ring);margin-left:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
  .tile{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--ring);border-radius:16px;padding:10px 10px 14px}
  .tile h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:12px 4px 4px}
  .tile p{font-size:14px;color:var(--ink-2);margin:0 4px 10px;max-width:60ch}
  /* shot roulette: one random shot whose parts fit together */
  .roll{margin-top:16px;background:linear-gradient(135deg,rgba(134,182,239,.09),rgba(217,89,38,.09)),var(--surface);
        border:1px solid var(--ring);border-radius:16px;padding:12px 14px}
  .roll-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .roll-bar b{display:block;font-size:16px}
  .roll-bar span{font-size:13px;color:var(--ink-2)}
  .roll button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--plane);
               font:700 14px/1 inherit;cursor:pointer;white-space:nowrap}
  .roll button.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--ring-2)}
  .roll button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .roll-card{display:grid;gap:14px;margin-top:12px}
  @media (min-width:760px){.roll-card{grid-template-columns:minmax(260px,400px) 1fr;align-items:start}}
  .roll .role{font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:#f08a5d}
  .roll .role small{display:block;margin-top:2px;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-2)}
  .roll h3{font-size:clamp(18px,2.4vw,22px);font-weight:750;letter-spacing:-.01em;margin:8px 0 10px;line-height:1.2}
  .roll dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px}
  .roll dt{color:var(--muted)} .roll dd{color:var(--ink-2)} .roll dd b{color:var(--ink)}
  .roll dd a{color:var(--accent);text-decoration:none;white-space:nowrap} .roll dd a:hover{text-decoration:underline}
  .roll .do{margin-top:10px;font-size:14px;color:var(--ink)}
  .roll .set{display:inline-block;margin-top:8px}
  .roll-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tile .set,.roll .set{align-self:flex-start;margin:auto 4px 0;font-size:12.5px;color:var(--accent);background:rgba(134,182,239,.10);
             border:1px solid rgba(134,182,239,.16);border-radius:8px;padding:3px 8px}

  /* viewfinder: scene layers inside a clipped 16:9 frame; sizes in cqw so subjects scale with the tile.
     Subjects are inline-SVG symbols (subject library in the script). People take their colors from --p (top),
     --pd (sleeves, legs, far side), --h (skin) and --hair, so .you / .pal recolor one drawing. */
  .vf{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;container-type:inline-size;
      --p:#596273;--pd:#454d5c;--h:#cdb6a2;--hair:#24212a;--car:#b9c2d0;
      --ease:cubic-bezier(.65,0,.35,1)}
  .s,.L,.k{position:absolute;inset:0}
  .it{position:absolute;display:block;overflow:visible}
  .rect{position:absolute}
  .you{--p:#e0703f;--pd:#b5532a;--h:#efc29f}
  .pal{--p:#4f8bd6;--pd:#3768a8;--h:#efc29f}
  .pald{--p:#2d4a70;--pd:#22395a;--h:#b98f72;--hair:#14121a}
  .alt{--p:#7b6a86;--pd:#5e5068}
  .c3{--p:#c2412d;--pd:#962c1d} .c4{--p:#e3b23c;--pd:#b5871f}
  .taxi{--car:#f0b43c}
  .sil{--p:#0b0907;--pd:#0b0907;--h:#0b0907;--hair:#0b0907}
  .flip{transform:scaleY(-1);opacity:.45}
  .ghost{opacity:.35}
  .up1{rotate:135deg} .up2{rotate:-135deg} .up3{rotate:45deg} .up4{rotate:-45deg}
  .vf::before{ /* rule of thirds */
    content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
    background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.18) 33.3% 33.5%,transparent 33.6% 66.5%,rgba(255,255,255,.18) 66.6% 66.8%,transparent 66.9%),
               linear-gradient(transparent 33.2%,rgba(255,255,255,.18) 33.3% 33.6%,transparent 33.7% 66.4%,rgba(255,255,255,.18) 66.5% 66.8%,transparent 66.9%)
  }
  .tag{position:absolute;z-index:6;left:8px;top:7px;font:700 10px/1 ui-monospace,monospace;letter-spacing:.08em;color:#fff;
       background:rgba(0,0,0,.62);padding:4px 6px;border-radius:5px}
  .tag::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rec);margin-right:5px;
       vertical-align:1px;animation:blink 1.2s steps(2) infinite}

  @keyframes blink{50%{opacity:0}}
  /* Camera moves. Each one eases (--ease) and holds still at both ends like a real take: settle, move, settle.
     Moves that travel through space give each depth layer its own rate (--z zoom, --d / --x / --y shift): the
     near layer (f) moves most and the far layer (b) least, which is what sells depth. Transforms and opacity only;
     blur comes from pre-blurred copies that crossfade, never from an animated filter. */
  @keyframes dolly{0%,18%{transform:none}82%,100%{transform:scale(var(--z))}}
  @keyframes dollyout{0%,18%{transform:scale(var(--z))}82%,100%{transform:none}}
  @keyframes tilt{0%,16%{transform:scale(1.35) translateY(-12%)}84%,100%{transform:scale(1.35) translateY(12%)}}
  @keyframes ped{0%,16%{transform:none}84%,100%{transform:translateY(var(--y))}}
  @keyframes truck{0%,16%{transform:translateX(var(--d))}84%,100%{transform:translateX(calc(-1 * var(--d)))}}
  @keyframes slideoff{0%,18%{transform:none}82%,100%{transform:translateX(var(--x))}}
  @keyframes spin{0%,16%{transform:scale(1.6) rotate(0)}84%,100%{transform:scale(1.6) rotate(180deg)}} /* scale hides the corners */
  @keyframes hyper{from{transform:none}to{transform:scale(var(--z))}}
  @keyframes jitter{0%{transform:scale(1.04)}25%{transform:scale(1.04) translate(.6%,-.4%) rotate(.3deg)}
                    50%{transform:scale(1.04) translate(-.5%,.3%) rotate(-.2deg)}75%{transform:scale(1.04) translate(.4%,.5%) rotate(.15deg)}}
  @keyframes breath{to{transform:scale(1.025)}} /* lenses "breathe" a little while focus moves */
  @keyframes creep{to{transform:scale(1.07)}}  /* each shot of a cut pair drifts in, like live footage */
  @keyframes focus-out{0%,26%{opacity:1}74%,100%{opacity:0}}
  @keyframes focus-in{0%,26%{opacity:0}74%,100%{opacity:1}}
  @keyframes whipout{0%,38%{transform:none;animation-timing-function:cubic-bezier(.6,0,1,.6)}50%,100%{transform:translateX(-125%)}}
  @keyframes whipin{0%,50%{transform:translateX(125%);animation-timing-function:cubic-bezier(0,.4,.4,1)}62%,100%{transform:none}}
  @keyframes smear-on{0%,41%{opacity:0}47%,100%{opacity:1}}
  @keyframes smear-off{0%,41%{opacity:1}47%,100%{opacity:0}}
  @keyframes clear-on{0%,53%{opacity:0}60%,100%{opacity:1}}
  @keyframes clear-off{0%,53%{opacity:1}60%,100%{opacity:0}}
  @keyframes cutA{0%,49.9%{opacity:1}50%,100%{opacity:0}}
  @keyframes cutB{0%,49.9%{opacity:0}50%,100%{opacity:1}}
  @keyframes wipebar{0%,36%{transform:translateX(-115%)}50%{transform:none}64%,100%{transform:translateX(115%)}}
  /* subject moves: the camera stays locked and only the subject travels */
  @keyframes handin{0%,22%{transform:translate(45%,-70%)}72%,100%{transform:none}}
  @keyframes walkby{0%,12%{transform:translateX(-90%)}88%,100%{transform:translateX(90%)}}
  @keyframes passby{0%,34%{transform:translateX(-135%)}66%,100%{transform:translateX(135%)}}
  @keyframes cross{from{transform:translateX(-75%)}to{transform:translateX(75%)}}
  @keyframes stream{to{transform:translateX(-60%)}} /* items repeat every 60% -> seamless loop */
  @keyframes drift{from{transform:translateX(var(--d))}to{transform:translateX(calc(-1 * var(--d)))}}
  @keyframes walkin{0%{transform:scale(.3);opacity:0}8%{transform:scale(.3);opacity:1;animation-timing-function:cubic-bezier(.5,0,.9,.7)}
                    78%{transform:none}92%{opacity:1}100%{transform:none;opacity:0}}
  @keyframes walkout{0%{transform:none;opacity:0}6%,20%{transform:none;opacity:1;animation-timing-function:cubic-bezier(.1,.3,.5,1)}
                     88%{transform:scale(.22);opacity:1}100%{transform:scale(.22);opacity:0}}
  /* subject life: small idle motion so even static frames read as video */
  @keyframes step{50%{translate:0 -3.5%}}
  @keyframes breathe{50%{scale:1 1.018}}
  @keyframes nod{30%{rotate:-2deg}65%{rotate:1.5deg}}
  @keyframes work{50%{rotate:-4deg;translate:-2% 0}}
  @keyframes rise{0%{translate:0 8%;scale:.85;opacity:0}35%{opacity:.95}100%{translate:0 -16%;scale:1.15;opacity:0}}
  @keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
  @keyframes flick{0%,90%,94%,97%,100%{opacity:1}92%{opacity:.35}95.5%{opacity:.6}}
  @keyframes glow{50%{opacity:.55}}
  @keyframes ripple{50%{scale:1.04 1}}

  /* push / pull: a real dolly, so near layers grow faster than far ones */
  .m-push .L{animation:dolly 7s var(--ease) infinite alternate}
  .m-push .b{--z:1.1} .m-push .m{--z:1.32} .m-push .f{--z:1.65}
  .m-pull .L{animation:dollyout 7s var(--ease) infinite alternate}
  .m-pull .b{--z:1.45} .m-pull .m{--z:2.3} .m-pull .f{--z:2.8}
  .m-lead .b{--z:1.55;animation:dollyout 7s var(--ease) infinite alternate} /* camera backs away ahead of them: the place recedes */
  .m-hyper .L{animation:hyper 5s steps(10) infinite} .m-hyper .b{--z:1.25} .m-hyper .m{--z:1.6}
  .m-hyper .s{animation:jitter 2s steps(1) infinite}
  /* tilt and pan rotate the camera, so the frame moves as one; pedestal and truck move it, so layers separate */
  .m-tilt .s{animation:tilt 8s var(--ease) infinite alternate}
  .m-pan .b{--d:15%;animation:truck 10s var(--ease) infinite alternate}
  .m-rise .L{animation:ped 8s var(--ease) infinite alternate} .m-rise .b{--y:5%} .m-rise .m{--y:9%} .m-rise .f{--y:62%}
  .m-parallax .L{animation:truck 8s var(--ease) infinite alternate}
  .m-parallax .b{--d:2%} .m-parallax .m{--d:8%} .m-parallax .f{--d:30%}
  .m-reveal .L{animation:slideoff 7s var(--ease) infinite alternate}
  .m-reveal .b{--x:-3%} .m-reveal .m{--x:-9%} .m-reveal .f{--x:-112%}
  .m-orbit .L{animation:truck 7s var(--ease) infinite alternate} .m-orbit .b{--d:26%} .m-orbit .m{--d:-3%}
  .m-dolly .b{--z:2;animation:dolly 7s var(--ease) infinite alternate} /* subject holds its size, background swells */
  .m-spin .s{animation:spin 9s var(--ease) infinite alternate}
  .m-dutch .s{transform:rotate(-14deg) scale(1.42)} /* 1.42 = cos14 + 16/9*sin14, so the ground's edges never show */
  /* moving camera, constant speed: walking and train windows don't ease */
  .m-follow .b{animation:stream 4s linear infinite}
  .m-window .b{--d:2%;animation:drift 10s ease-in-out infinite alternate}
  .m-window .m{animation:stream 4s linear infinite}
  .m-window .f{animation:stream .9s linear infinite;filter:url(#mb)}
  /* focus: sharp and pre-blurred copies trade places */
  .m-rack .s{animation:breath 6s var(--ease) infinite alternate}
  .m-rack .soft{filter:blur(4.5px)}
  .m-rack .f .k:not(.soft),.m-rack .b .soft{animation:focus-out 6s var(--ease) infinite alternate}
  .m-rack .f .soft,.m-rack .b .k:not(.soft){animation:focus-in 6s var(--ease) infinite alternate}
  /* whip: the shot accelerates out, a motion-blurred copy takes over mid-swing, the next shot decelerates in */
  .m-whip .smear{filter:url(#mb2)}
  .m-whip .m{animation:whipout 5s linear infinite} .m-whip .f{animation:whipin 5s linear infinite}
  .m-whip .m .k:not(.smear){animation:smear-off 5s linear infinite} .m-whip .m .smear{animation:smear-on 5s linear infinite}
  .m-whip .f .k:not(.smear){animation:clear-on 5s linear infinite} .m-whip .f .smear{animation:clear-off 5s linear infinite}
  /* cuts */
  .m-match .m,.m-wipe .m,.m-jumpcut .m,.m-eyeline .m{animation:cutA 5s linear infinite}
  .m-match .f,.m-wipe .f,.m-jumpcut .f,.m-eyeline .f{animation:cutB 5s linear infinite}
  .m-match .s,.m-wipe .s,.m-eyeline .s{animation:creep 2.5s linear infinite}
  .m-wipe .x{animation:wipebar 5s linear infinite;filter:url(#mb)}
  /* locked-off camera: only the subject moves */
  .m-topdown .f,.m-reach .f{animation:handin 5s var(--ease) infinite alternate}
  .m-lockoff .f{animation:walkby 8s linear infinite}
  .m-pass .f{animation:passby 4.5s linear infinite;filter:url(#mb)}
  .m-crowd .m{animation:cross 4s linear infinite}
  .m-crowd .f{animation:cross 2.2s linear infinite;filter:url(#mb)}
  .m-timelapse .m{animation:cross 3s linear infinite;filter:url(#mb2)}
  .m-approach .f{transform-origin:50% 70%;animation:walkin 7s linear infinite}
  .m-exit .f{transform-origin:50% 70%;animation:walkout 7s linear infinite}
  /* subject life, set per symbol (IDLE in the script) or per item */
  .breathe{transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
  .talk{transform-origin:50% 95%;animation:nod 2.6s ease-in-out infinite}
  .work{transform-origin:50% 100%;animation:work 1.8s ease-in-out infinite}
  .steam{animation:rise 2.8s linear infinite}
  .sway{transform-origin:50% 0;animation:sway 3.4s ease-in-out infinite}
  .flick{animation:flick 4.2s linear infinite}
  .glow{animation:glow 3s ease-in-out infinite}
  .walk{transform-origin:50% 100%;animation:step .56s ease-in-out infinite}
  .it.flip{animation:ripple 2.4s ease-in-out infinite}
  .it:nth-child(2n){animation-delay:-.3s} .it:nth-child(3n){animation-delay:-1.1s} /* people don't move in lockstep */

  /* pause tiles that are off-screen (set by JS) — saves battery on long phone scrolls */
  .vf.off *,.vf.off .tag::before{animation-play-state:paused!important}
  /* reduced motion: frames hold still; hover or tap a frame to play it */
  @media (prefers-reduced-motion:reduce){
    .vf *,.vf .tag::before{animation-play-state:paused!important}
    .tile:hover .vf:not(.off) *,.vf.play:not(.off) *{animation-play-state:running!important}
    .vf{cursor:pointer}
    .vf::after{content:"▶ tap to play";position:absolute;z-index:6;right:8px;bottom:7px;font:600 10px/1 system-ui,sans-serif;
               color:#fff;background:rgba(0,0,0,.62);padding:4px 6px;border-radius:5px}
    .vf.play::after{content:"❚❚ pause"}
  }

  /* ND filter guide: reference cards with tables; one column on phones, two on wide screens */
  .nd-lead{font-size:14px;color:var(--ink-2);margin:-4px 0 14px;max-width:70ch} .nd-lead b{color:var(--ink)}
  .nd{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
  .nd-card{background:var(--surface);border:1px solid var(--ring);border-radius:16px;padding:14px 16px;min-width:0}
  .nd-card h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
  .nd-card h3 small{display:block;margin-top:2px;font:500 12px/1.3 ui-monospace,monospace;color:var(--muted);letter-spacing:0}
  .nd-card > p{font-size:13.5px;color:var(--ink-2);margin-top:10px} .nd-card > p b{color:var(--ink)}
  .nd-steps{list-style:none;counter-reset:st;display:grid;gap:7px}
  .nd-steps li{counter-increment:st;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:13.5px;color:var(--ink-2)}
  .nd-steps li::before{content:counter(st);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
                       background:var(--surface-2);border:1px solid var(--ring-2);color:var(--ink);font-size:12px;font-weight:700}
  .nd-steps b{color:var(--ink)}
  .nd-rule{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13.5px;color:var(--ink-2);
           background:rgba(134,182,239,.08);border:1px solid rgba(134,182,239,.2)}
  .nd-rule b{color:var(--ink)} .nd-rule svg{flex:none;width:76px;height:40px}
  .nd-warn{margin:0 0 12px;padding:10px 12px;border-radius:12px;font-size:14.5px;line-height:1.4;color:var(--ink);
           background:rgba(217,89,38,.14);border:1px solid rgba(217,89,38,.5)}
  .nd-warn strong{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#f08a5d;margin-bottom:2px}
  .nd-warn q{quotes:"“" "”";font-weight:750;white-space:nowrap}
  .nd-tw{overflow-x:auto;margin:0 -4px}

// idle motion each subject carries by default (its own life while the camera does its move)
const IDLE = {walk:'walk', stand:'breathe', sit:'breathe', bust:'talk', face:'breathe', chef:'work', cat:'breathe',
  steam:'steam', lantern:'sway', sign:'flick', bokeh:'glow'};
// moves drawn as two copies of each layer, one sharp and one pre-blurred, that crossfade
const TWIN = {rack:'soft', whip:'smear'};
const item = ([g, x, y, a, b = '']) => g.startsWith('#')
  ? `<div class="rect" style="background:${g};left:${x}%;top:${y}%;width:${a}%;height:${b}%"></div>`
  : `<svg class="it ${IDLE[g] || ''} ${b}" style="left:calc(${x}% - ${a / 2}cqw);top:calc(${y}% - ${a / 2}cqw);width:${a}cqw;height:${a}cqw"><use href="#s-${g}"/></svg>`;
const layers = (L, twin) => ['b', 'm', 'f', 'x'].map(k => {
  const h = (L[k] || []).map(item).join('');
  return `<div class="L ${k}">${twin && h ? `<div class="k">${h}</div><div class="k ${twin}">${h}</div>` : h}</div>`;
}).join('');

const slug = t => t.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
// readable move labels for the REC tag; unknown ids fall back to the raw id
const MOVE = {topdown:'top-down', lockoff:'lock-off', hyper:'hyperlapse', rack:'rack focus', dolly:'dolly zoom', pass:'pass-by',
  jumpcut:'jump cut', whip:'whip pan', match:'match cut', approach:'walk-in', spin:'spin', still:'static',
  exit:'walk-away', rise:'pedestal', eyeline:'eyeline match', reach:'POV', lead:'leading'};
const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const frame = s => `<div class="vf m-${s.mv}" style="background:linear-gradient(${s.sky})" role="img" aria-label="${esc(s.n)}: ${MOVE[s.mv] || s.mv} demo">
        <div class="s" aria-hidden="true">${layers(s.L, TWIN[s.mv])}</div><span class="tag" aria-hidden="true">${MOVE[s.mv] || s.mv}</span>

  pil:  ['🍃', 'pillow shot', 'A quiet pause between scenes. No action needed.', ['w', 'm', 'cu'], 1],
  tr:   ['✂️', 'transition',  'Gets you out of this place and into the next one.', ['w', 'm'], 1],
  end:  ['🌙', 'closer',      'Ends the scene or the day.', ['xw', 'w'], 1],
};
const ORDER = ['est', 'exp', 'hum', 'det', 'talk', 'pil', 'tr', 'end']; // a scene, start to finish
const SZ = {xw:'extreme wide', w:'wide', m:'medium', mcu:'medium close-up', cu:'close-up', ecu:'extreme close-up / detail'};
const ANG = {E:'eye level', L:'low angle', H:'high angle', B:'bird’s-eye', D:'dutch tilt', W:'hip level'};
// sizes that make sense for each kind of subject (you can't extreme-wide a manhole cover)
const KSZ = {thing:'m cu ecu', food:'m cu ecu', hands:'cu ecu', face:'mcu cu', vista:'xw w', tower:'xw w', place:'xw w m',
  crowd:'xw w m', transit:'w m cu', motion:'w m cu ecu', person:'w m mcu', animal:'w m cu', night:'xw w m', light:'xw w m'};
const PEOPLE = new Set(['person', 'face', 'hands', 'animal']);
// generic subject types: [name, kind, examples]. KIND below tags the trip-specific ideas so a roll can
// suggest one from the Subjects tab as "on this trip".
const GENERIC = [
  ['a landscape', 'vista', 'mountains, a lake, the sea, fields from a train'],
  ['a skyline', 'vista', 'towers from a deck, a city across a river'],
  ['a tall building', 'tower', 'a skyscraper, a TV tower, a pagoda'],
  ['a building or shop front', 'place', 'a convenience store, a temple or palace gate, a café, a noodle stall'],
  ['a street or lane', 'place', 'an alley, a shopping arcade, a quiet residential street'],
  ['a night street', 'night', 'neon signs, lanterns, lit-up shop windows'],
  ['a crowd', 'crowd', 'a crossing, a station at rush hour, a market'],
  ['a train or vehicle', 'transit', 'a train, a bus, a taxi, a ferry'],
  ['a static object', 'thing', 'a vending machine, a lantern, a parked bike, a sign in local script'],
  ['a moving object', 'motion', 'steam, a flag, a turning sign, water, laundry in the wind'],
  ['a machine at work', 'motion', 'a ticket machine, a can dropping out, a departure board, a crossing signal'],
  ['a texture or detail', 'thing', 'wood grain, a stamp, a manhole cover, rain on a sign'],
  ['food', 'food', 'a bowl, a plate, a drink, a dessert'],
  ['food being made', 'food', 'a cook at a grill, a pour, a flip, plating'],
  ['light itself', 'light', 'a low sun, long shadows, a reflection, a flare'],
  ['your companion', 'person', 'walking, looking, ordering, waiting'],
  ['a face', 'face', 'a reaction, a laugh, a first bite'],
  ['hands', 'hands', 'paying, pouring, holding a ticket, washing at a basin'],
  ['a local at work', 'person', 'a chef, a vendor, station staff (ask first)'],
  ['an animal', 'animal', 'a cat on a step, deer at a temple, birds, koi'],
];
// subject -> kind ('one signature shot per city' is left out: each of those already names its shot)
const KIND = {'vending machines':'motion', 'convenience store run':'place', 'crossing signals':'motion',
  'station details':'transit', 'bikes & scooters':'thing', 'tiny lanes':'place', 'signs in local script':'thing',
  'street details':'thing', 'ticket machine to bowl':'food', 'street food cooking':'food', 'food markets':'food',
  'steam':'motion', 'table grill':'food', 'café culture':'food', 'water & incense':'motion', 'wishes & offerings':'thing',
  'gates in a row':'place', 'traditional dress':'person', 'temple animals':'animal', 'morning sweep':'person',
  'winter illuminations':'night', 'year-end decor':'thing', 'low winter sun':'light', 'clear cold days':'vista',
  'bundled up':'person', 'neon districts':'night', 'towers framed':'tower', 'old against new':'place',
  'river at night':'night', 'elevated trains':'transit', 'companion\'s hands':'hands', 'first reactions':'face',
  'makers at work':'person', 'in and out':'person', 'strangers, from afar':'crowd'};
// move tile -> [roles, subject kinds it works on, angles it allows]
const RECIPE = {
  'overhead hands-in': ['det', 'food thing hands', 'B'],
  'push-in on steam': ['det', 'food motion', 'E H'],
  'rack focus': ['det', 'food thing motion night', 'E'],
  'tilt-up reveal': ['est', 'place tower', 'L E'],
  'foreground reveal': ['est', 'place vista tower', 'E'],
  'symmetry lock-off': ['est pil', 'place transit', 'E'],
  'follow walk': ['exp', 'place crowd person night', 'E W'],
  'low-angle crowd': ['exp', 'crowd transit', 'L'],
  'hyperlapse': ['est', 'place tower night crowd', 'E'],
  'tower tilt-up': ['est', 'tower night', 'L'],
  'corner reveal': ['est', 'place tower crowd night', 'E'],
  'observation deck pan': ['est end', 'vista night tower', 'H'],
  'crossing from above': ['est', 'crowd', 'B H'],
  'light trails': ['est end', 'night', 'H'],
  'frame in a frame': ['est pil', 'tower place vista', 'E L'],
  'window parallax': ['exp tr', 'vista transit', 'E'],
  'platform pass-by': ['exp tr', 'transit', 'E L'],
  'detail cutaway': ['det', 'thing food transit motion', 'H E'],
  'foreground slide': ['est', 'vista place', 'E L'],
  'cloud timelapse': ['est pil', 'vista light', 'E L'],
  'pull-out reveal': ['est end', 'person vista place', 'E H'],
  'puddle reflection tilt': ['est pil', 'night place tower', 'L'],
  'bokeh rack': ['hum', 'person face', 'E'],
  'orbit': ['hum exp', 'person animal', 'E L'],
  'sun peek flare': ['est pil', 'light place tower', 'L E'],
  'rain-on-glass rack': ['pil', 'night place', 'E'],
  'night window reflection': ['pil', 'night vista', 'E'],
  'shadow walk': ['pil exp', 'light person', 'H'],
  'selfie walk-and-talk': ['talk', 'place crowd night', 'E'],
  'set-down talk': ['talk', 'place vista food', 'E'],
  'talk, then turn': ['talk tr', 'place tower vista food animal night', 'E'],
  'walk-in intro': ['talk est', 'place vista', 'E'],
  'silhouette': ['hum end', 'person light', 'L E'],
  'over-the-shoulder': ['hum exp', 'person vista place food tower', 'E'],
  'hands doing things': ['det', 'hands food thing', 'H E'],
  'follow-me lead': ['hum exp tr', 'person place crowd', 'E'],
  'candid reaction': ['hum', 'face food animal', 'E'],
  'local at work': ['hum', 'person food', 'E'],
  'look, then see': ['hum', 'person vista place tower animal', 'E'],
  'leading shot': ['hum exp', 'person place', 'E'],
  'POV reach-in': ['det', 'hands thing motion food transit', 'E H'],
  'Tilt Locked glide': ['exp', 'place night crowd', 'E W'],
  'ground skim': ['exp tr', 'place crowd tower', 'L'],
  'SpinShot sky-up': ['est tr', 'tower', 'L'],
  'ActiveTrack walk-by': ['hum exp', 'person animal', 'E'],
  'Motionlapse': ['est end', 'vista night light', 'H E'],
  'whip pan': ['tr', 'place tower vista food crowd night transit person', 'E'],
  'object wipe': ['tr', 'place crowd person', 'E'],
  'pillow shot': ['pil', 'thing motion place night', 'E L'],
  'frame in, frame out': ['tr pil', 'transit place crowd motion', 'E'],
  'walk-away exit': ['end', 'person place transit', 'E'],
  'still in the rush': ['hum est', 'crowd', 'E H'],
  'escalator rise': ['est', 'place tower crowd', 'E'],
  'sound-first clip': ['pil det', 'thing motion transit food place', 'E'],
};
const TILE = {};
SHEET.forEach(([, sec, shots]) => shots.forEach(s => TILE[s.n] = {...s, sec}));
const TRIP = SUBJECTS.flatMap(([, sec, ideas]) => ideas.map(([n]) => ({n, sec, k: KIND[n]}))).filter(s => s.k);
const SUBJ = GENERIC.map(([n, k, t]) => ({n, k, t}));
const MOVES = Object.entries(RECIPE).filter(([n]) => TILE[n]).map(([n, [r, k, a]]) => ({n, r: r.split(' '), k: k.split(' '), a: a.split(' ')}));
const pick = a => a[Math.floor(Math.random() * a.length)];
// in a human or vlog beat the size frames the person, so a non-person subject becomes the backdrop
const isBackdrop = (role, s) => (role === 'hum' || role === 'talk') && !PEOPLE.has(s.k);
const sizesFor = (role, s) => isBackdrop(role, s) ? ROLES[role][3] : ROLES[role][3].filter(z => KSZ[s.k].split(' ').includes(z));
const combos = (role, subj) => MOVES.filter(m => m.r.includes(role)).flatMap(m =>
  (subj ? [subj] : SUBJ).filter(s => m.k.includes(s.k) && sizesFor(role, s).length).map(s => ({m, s})));
const feels = n => (TILE[n]?.set.match(/feels: ([^·]+)/) || [, ''])[1].trim();
const cap = t => t[0].toUpperCase() + t.slice(1);
let last = null;

function roll(role, subj, avoid) {
  if (!role) { // weighted pick of a role
    const bag = ORDER.flatMap(r => Array(ROLES[r][4]).fill(r));
    role = pick(bag);
  }
  let cs = combos(role, subj);
  if (avoid) cs = cs.filter(c => c.m.n !== avoid).length ? cs.filter(c => c.m.n !== avoid) : cs;
  const {m, s} = pick(cs), [ricon, rname, why] = ROLES[role];
  const backdrop = isBackdrop(role, s);
  const tk = TRIP.filter(x => x.k === s.k), trip = tk.length ? pick(tk) : null;
  const size = pick(sizesFor(role, s)), angle = pick(m.a), t = TILE[m.n];
  const sz = SZ[size].replace(' / detail', '');
  const head = backdrop ? (role === 'talk' ? `${sz} of you, ${s.n} behind` : `${sz} of your companion, ${s.n} around them`)
                        : `${sz} of ${s.n}`;
  last = {role, s, m: m.n};
  document.getElementById('roll-out').innerHTML = `
    <div class="roll-card">
      ${frame(t)}
      <div>
        <p class="role">${ricon} ${rname}<small>${why}</small></p>
        <h3>${cap(head)}, ${ANG[angle]}, ${t.n}</h3>
        <dl>
          <dt>subject</dt><dd><b>${s.n}</b>: ${s.t}</dd>
          ${trip ? `<dt>this trip</dt><dd>${trip.n} <a href="#${slug(trip.sec)}">${trip.sec} ↗</a></dd>` : ''}
          <dt>size</dt><dd><b>${SZ[size]}</b> <a href="#shot-sizes">sizes ↗</a></dd>
          <dt>angle</dt><dd><b>${ANG[angle]}</b>${feels(ANG[angle]) ? ` · feels: ${feels(ANG[angle])}` : ''} <a href="#angles-and-what-they-say">angles ↗</a></dd>
          <dt>move</dt><dd><b>${t.n}</b> <a href="#${slug(t.sec)}">${t.sec} ↗</a></dd>
        </dl>
        <p class="do">${t.how}</p><span class="set">${t.set}</span>
        <div class="roll-btns"><button id="roll-again">🎲 Roll again</button><button class="alt" id="roll-next">➡️ Next shot, same subject</button></div>
      </div>
    </div>`;
}
// next shot: same subject, the next role in scene order that this subject can fill
function next() {
  const i = ORDER.indexOf(last.role);
  for (let j = 1; j <= ORDER.length; j++) {
    const r = ORDER[(i + j) % ORDER.length];
    if (combos(r, last.s).length) return roll(r, last.s, last.m);
  }
}
document.getElementById('roll').addEventListener('click', e => {
  const id = e.target.closest('button')?.id;
  if (id === 'roll-go' || id === 'roll-again') roll();
  if (id === 'roll-next') next();
});

// show one group at a time: its tab, its chips, its sections
let cur = -1;
const showGroup = (i, scroll) => {
  if (i === cur) return; cur = i;
  document.querySelectorAll('#groups button').forEach(b => b.setAttribute('aria-selected', b.dataset.i == i));
  document.querySelectorAll('#toc li, #sheet section').forEach(el => el.hidden = el.dataset.g != i);
  links.forEach(l => l.removeAttribute('aria-current'));
  const first = document.querySelector(`#sheet section[data-g="${i}"]`);
  setActive(first.id);
  if (scroll && document.querySelector('.toc').getBoundingClientRect().top <= 0) scrollTo({top: first.offsetTop - document.querySelector('.toc').offsetHeight - 12, behavior: 'auto'});
};
document.getElementById('groups').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  showGroup(+b.dataset.i, true);
  history.replaceState(null, '', '#' + slug(GROUPS[b.dataset.i][1]));
});
const fromHash = () => {
  const h = decodeURIComponent(location.hash.slice(1)), gi = GROUPS.findIndex(([, g]) => slug(g) === h);
  if (gi >= 0) return showGroup(gi);
  if (h in groupOf) { showGroup(groupOf[h]); document.getElementById(h).scrollIntoView(); return; }
  showGroup(0);
};
addEventListener('hashchange', fromHash);

// highlight the section in view and keep its chip visible in the nav
const toc = document.querySelector('.toc ul'), links = new Map([...toc.querySelectorAll('a')].map(a => [a.hash.slice(1), a]));
const setActive = id => {
  const a = links.get(id); if (!a || a.hasAttribute('aria-current')) return;
  links.forEach(l => l.removeAttribute('aria-current'));
  a.setAttribute('aria-current', 'true');
  const li = a.parentElement;
  if (toc.scrollWidth > toc.clientWidth) toc.scrollTo({left: li.offsetLeft - (toc.clientWidth - li.offsetWidth) / 2, behavior: rm.matches ? 'auto' : 'smooth'});
};
const spy = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && setActive(e.target.id)), {rootMargin: '-30% 0px -65% 0px'});
document.querySelectorAll('#sheet section').forEach(s => spy.observe(s));
// the last sections are too short to reach the spy band, so the page bottom selects the last one
addEventListener('scroll', () => {
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) setActive([...document.querySelectorAll('#sheet section:not([hidden])')].pop().id);
}, {passive: true});
fromHash();
</script>
</body>
