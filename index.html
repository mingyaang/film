<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<title>ND filter guide 🕶️</title>
<style>
  :root{--plane:#0a0a0c;--surface:#16161b;--surface-2:#1f1f26;--ink:#fff;--ink-2:#c3c2b7;--muted:#9a988f;--ring:rgba(255,255,255,.10);--ring-2:rgba(255,255,255,.22);
         --accent:#86b6ef;--accent-2:#d95926;--rec:#ff4d4d;--pad:clamp(16px,3vw,40px);--nav-h:120px;color-scheme:dark}
  html{scroll-padding-top:calc(var(--nav-h) + 12px)}
  @media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(80rem 40rem at 15% -10%,#1b2a4a 0%,transparent 60%),
               radial-gradient(60rem 35rem at 90% 0%,#3a1e14 0%,transparent 55%),var(--plane);
    color:var(--ink);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;padding:var(--pad);padding-top:max(var(--pad),env(safe-area-inset-top));min-height:100vh
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:clamp(30px,5.5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.02}
  h1 .grad{background:linear-gradient(92deg,#86b6ef,#d95926 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--ink-2);margin-top:8px;max-width:62ch}
  .ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
  .idea{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:12px 14px}
  .idea h3{font-size:15.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
  .idea p{font-size:13.5px;color:var(--ink-2)}
  section{margin-top:40px}
  h2{display:flex;align-items:center;gap:10px;font-size:clamp(19px,2.4vw,22px);font-weight:750;letter-spacing:-.01em;margin-bottom:14px}
  h2 i{font-style:normal;font-size:1.15em}
  h2 small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
  h2::after{content:"";flex:1;height:1px;background:var(--ring);margin-left:4px}
  /* ND filter guide: reference cards with tables; one column on phones, two on wide screens */
  .nd-lead{font-size:14px;color:var(--ink-2);margin:-4px 0 14px;max-width:70ch} .nd-lead b{color:var(--ink)}
  .nd{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
  .nd-card{background:var(--surface);border:1px solid var(--ring);border-radius:16px;padding:14px 16px;min-width:0}
  .nd-card h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
  .nd-card h3 small{display:block;margin-top:2px;font:500 12px/1.3 ui-monospace,monospace;color:var(--muted);letter-spacing:0}
  .nd-card > p{font-size:13.5px;color:var(--ink-2);margin-top:10px} .nd-card > p b{color:var(--ink)}
  .nd-steps{list-style:none;counter-reset:st;display:grid;gap:7px}
  .nd-steps li{counter-increment:st;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:13.5px;color:var(--ink-2)}
  .nd-steps li::before{content:counter(st);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
                       background:var(--surface-2);border:1px solid var(--ring-2);color:var(--ink);font-size:12px;font-weight:700}
  .nd-steps b{color:var(--ink)}
  .nd-rule{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13.5px;color:var(--ink-2);
           background:rgba(134,182,239,.08);border:1px solid rgba(134,182,239,.2)}
  .nd-rule b{color:var(--ink)} .nd-rule svg{flex:none;width:76px;height:40px}
  .nd-warn{margin:0 0 12px;padding:10px 12px;border-radius:12px;font-size:14.5px;line-height:1.4;color:var(--ink);
           background:rgba(217,89,38,.14);border:1px solid rgba(217,89,38,.5)}
  .nd-warn strong{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#f08a5d;margin-bottom:2px}
  .nd-warn q{quotes:"“" "”";font-weight:750;white-space:nowrap}
  .nd-tw{overflow-x:auto;margin:0 -4px}
  .nd-t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
  .nd-t caption{text-align:left;font:600 12px/1 ui-monospace,monospace;color:var(--muted);padding:0 4px 8px}
  .nd-t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
           padding:6px 4px;border-bottom:1px solid var(--ring-2)}
  .nd-t td{padding:7px 4px;border-bottom:1px solid var(--ring);color:var(--ink-2);vertical-align:middle}
  .nd-t tr:last-child td{border-bottom:0}
  .nd-t td b{color:var(--ink);white-space:nowrap}
  .nd-t td:not(:first-child),.nd-t th:not(:first-child){white-space:nowrap}
  .nd-t .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0;background:var(--sw);
            box-shadow:0 0 0 1px var(--ring-2)}
  .nd-t .bar{display:block;height:4px;width:60px;margin-top:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
  .nd-t .bar::before{content:"";display:block;height:100%;width:calc(var(--s) * 10%);border-radius:2px;
                     background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .nd-t tr.hl td{background:rgba(217,89,38,.12)} .nd-t tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--accent-2)}
  .nd-opts{display:grid;gap:8px}
  .nd-opts .idea{background:var(--surface-2)}
  .nd-ex{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-bottom:10px}
  .nd-ex dt{color:var(--muted)} .nd-ex dd{color:var(--ink-2)} .nd-ex dd b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ND filter <span class="grad">guide</span> 🕶️</h1>
  <p class="sub">Pocket 4 · D-Log. Which ND to use for each kind of light, and how to read filter labels.</p>
  <section id="nd"></section>
</div>
<script>
const ND_LIGHT = [
  ['Bright sun, beach or snow', '#fff6d8', '~10', 10, 'ND1000'],
  ['Bright sun', '#ffe08a', '~9', 9, 'ND512'],
  ['Hazy sun, light clouds', '#efd29c', '~8', 8, 'ND256'],
  ['Overcast', '#b9c0c8', '~6–7', 6.5, 'ND64–ND128'],
  ['Heavy overcast, open shade', '#7f8896', '~5–6', 5.5, 'ND32–ND64'],
  ['Golden hour', '#e8954f', '~3–4', 3.5, 'ND8–ND16'],
  ['Dusk, indoors, night', '#2c3a66', '0', 0, 'none'],
];
const ND_LABELS = [['ND2', '0.3', '1'], ['ND4', '0.6', '2'], ['ND8', '0.9', '3'], ['ND16', '1.2', '4'], ['ND32', '1.5', '5'], ['ND64', '1.8', '6'],
  ['ND100', '2.0', '6.6'], ['ND128', '2.1', '7'], ['ND256', '2.4', '8'], ['ND512', '2.7', '9'], ['ND1000', '3.0', '10']];

document.getElementById('nd').innerHTML = `
    <p class="nd-lead">Camera: fixed <b>f/2</b> lens. Shoot <b>ISO 400</b> (or the lowest ISO D-Log allows), shutter <b>1/50 s</b> at 24 fps.</p>
    <div class="nd">
      <div class="nd-card">
        <h3>📍 on location</h3>
        <ol class="nd-steps">
          <li><span><b>Lock settings:</b> ISO 400, shutter 1/50, white balance fixed.</span></li>
          <li><span>Turn on the <b>histogram</b> (and zebras if available).</span></li>
          <li><span>Put on the <b>starting ND</b> from the table.</span></li>
          <li><span>Aim at the brightest thing you care about, usually the sky. If the histogram touches the right edge, or zebras show on the sky, go <b>one filter stronger</b>.</span></li>
          <li><span>Between two filters, fine-tune with <b>shutter 1/40 to 1/100</b>. Motion blur still looks natural in that range.</span></li>
          <li><span><b>Re-check</b> when the light changes (sun to shade, clouds moving in).</span></li>
        </ol>
        <div class="nd-rule">
          <svg viewBox="0 0 76 40" aria-hidden="true" focusable="false">
            <path d="M2 38C10 36 14 30 20 26S30 30 36 22S46 8 52 12S62 30 66 36L68 38Z" fill="#86b6ef" opacity=".55"/>
            <path d="M2 38H74" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
            <path d="M73 2V38" stroke="#ff4d4d" stroke-width="2" stroke-dasharray="3 2"/>
          </svg>
          <span><b>D-Log rule:</b> keep the sky just under the right edge of the histogram and let shadows sit a little dark. The LUT lifts midtones back up, but clipped highlights cannot be recovered.</span>
        </div>
      </div>
      <div class="nd-card">
        <h3>☀️ starting ND by light</h3>
        <div class="nd-tw"><table class="nd-t">
          <caption>f/2 · ISO 400 · 1/50</caption>
          <thead><tr><th scope="col">Light</th><th scope="col">Stops to cut</th><th scope="col">ND</th></tr></thead>
          <tbody>${ND_LIGHT.map(([l, c, s, n, nd]) => `<tr><td><i class="sw" style="--sw:${c}" aria-hidden="true"></i>${l}</td>
            <td>${s}<span class="bar" style="--s:${n}" aria-hidden="true"></span></td><td><b>${nd}</b></td></tr>`).join('')}</tbody>
        </table></div>
        <p>These come from the <b>sunny-16 rule</b> adjusted for f/2. Treat them as a start point; they can be off by about <b>one stop</b>.</p>
      </div>
      <div class="nd-card">
        <h3>🏷️ reading ND labels</h3>
        <p class="nd-warn" role="note"><strong>⚠️ watch out</strong><q>ND2</q> means <b>1 stop</b>, but <q>ND 2.0</q> means <b>6.6 stops</b>.</p>
        <div class="nd-tw"><table class="nd-t">
          <caption>“ND” + factor = how many times darker · a decimal = optical density</caption>
          <thead><tr><th scope="col">Factor label</th><th scope="col">Density label</th><th scope="col">Stops</th></tr></thead>
          <tbody>${ND_LABELS.map(([f, d, s]) => `<tr${f === 'ND2' || f === 'ND100' ? ' class="hl"' : ''}><td><b>${f}</b></td><td>${d}</td>
            <td>${s}<span class="bar" style="--s:${s}" aria-hidden="true"></span></td></tr>`).join('')}</tbody>
        </table></div>
      </div>
      <div class="nd-card">
        <h3>🎒 what to carry</h3>
        <div class="nd-opts">
          <div class="idea"><h3>2-stop-spaced set: ND16, ND64, ND256</h3><p>Shutter 1/40–1/100 covers the gap between filters.</p></div>
          <div class="idea"><h3>or a variable ND (about 6–9 stops) + ND16</h3><p>The ND16 is for golden hour. Cheap variable NDs can show a dark X pattern or color cast at the strongest end.</p></div>
        </div>
      </div>
      <div class="nd-card">
        <h3>🎞️ worked example: walk clip 2026-10-24<small>DJI_20261024164540_0004</small></h3>
        <dl class="nd-ex">
          <dt>light</dt><dd>Overcast Seattle afternoon</dd>
          <dt>settings</dt><dd>ISO 400, filter <b>“ND 2”</b></dd>
          <dt>result</dt><dd>About <b>1 stop overexposed</b>; the sky clipped to pure white in 17–34% of the top third of bright frames.</dd>
        </dl>
        <div class="nd-opts">
          <div class="idea"><h3>if it was ND 2.0 (6.6 stops) at 1/50</h3><p>That is about one stop short of what this light needed. Use <b>ND128 (2.1)</b> or <b>ND256</b> next time, or <b>ND100 with shutter 1/100</b>.</p></div>
          <div class="idea"><h3>if it was ND2 (1 stop)</h3><p>The shutter must have been much faster than 1/50 to land only 1 stop over. Use <b>ND64–ND128 at 1/50</b> instead.</p></div>
        </div>
      </div>
    </div>`;
</script>
</body>
</html>
